<title>Vigie NPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#eceef2;
    --ink:#000000;
    --ink-2:#3a4350;
    --muted:#767f8c;
    --line:#dfe3e9;
    --line-strong:#c7cdd6;
    /* Bleu CelerAgens */
    --accent:#0047ab;
    --accent-strong:#00295e;
    --accent-soft:#e3ebf8;
    --accent-ink:#00295e;
    /* Vert CelerAgens — cas d'usage 2 */
    --case2:#00a650;
    --case2-strong:#00753a;
    --case2-soft:#e0f5ea;
    --case2-ink:#00552b;
    --good:#0ca30c;      --good-bg:#e3f5df;
    --warning:#b97300;   --warning-bg:#fdf0d3;
    --serious:#c85a2e;   --serious-bg:#fbe4d8;
    --critical:#d03b3b;  --critical-bg:#fbe1e1;
    --shadow: 0 1px 2px rgba(0,0,0,0.05), 0 8px 20px -12px rgba(0,0,0,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0c0e12;
      --surface:#16181d;
      --surface-2:#1c1f25;
      --ink:#ffffff;
      --ink-2:#c3c8d1;
      --muted:#8b93a0;
      --line:#282c33;
      --line-strong:#383e47;
      --accent:#5b8fdb;
      --accent-strong:#a9c6f5;
      --accent-soft:#16233d;
      --accent-ink:#a9c6f5;
      --case2:#2ecf85;
      --case2-strong:#8fe6bb;
      --case2-soft:#0f2e20;
      --case2-ink:#8fe6bb;
      --good:#3fbf3f;      --good-bg:#173a19;
      --warning:#f0b13d;   --warning-bg:#3c2e0d;
      --serious:#ef8a5e;   --serious-bg:#3d2617;
      --critical:#f0696a;  --critical-bg:#3d1c1c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 24px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0c0e12;
    --surface:#16181d;
    --surface-2:#1c1f25;
    --ink:#ffffff;
    --ink-2:#c3c8d1;
    --muted:#8b93a0;
    --line:#282c33;
    --line-strong:#383e47;
    --accent:#5b8fdb;
    --accent-strong:#a9c6f5;
    --accent-soft:#16233d;
    --accent-ink:#a9c6f5;
    --case2:#2ecf85;
    --case2-strong:#8fe6bb;
    --case2-soft:#0f2e20;
    --case2-ink:#8fe6bb;
    --good:#3fbf3f;      --good-bg:#173a19;
    --warning:#f0b13d;   --warning-bg:#3c2e0d;
    --serious:#ef8a5e;   --serious-bg:#3d2617;
    --critical:#f0696a;  --critical-bg:#3d1c1c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 24px -14px rgba(0,0,0,0.6);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:14px; line-height:1.5;
  }
  h1,h2,h3,.brand-name{ font-family:"Manrope", "Inter", sans-serif; text-wrap:balance; }
  .num, .tabular{ font-variant-numeric: tabular-nums; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  button, input{ font: inherit; color: inherit; }
  a{ color: var(--accent-strong); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  .app{
    display:grid;
    grid-template-columns: 264px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px){
    .app{ grid-template-columns: 1fr; }
    .rail{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); }
  }

  /* ---------- Rail ---------- */
  .rail{
    background:var(--surface-2);
    border-right:1px solid var(--line);
    padding:20px 16px 16px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:20px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:2px 4px 6px; }
  .brand-mark{ width:30px; height:30px; flex:none; }
  .brand-name{ font-weight:800; font-size:16.5px; letter-spacing:-0.01em; }
  .brand-sub{ font-size:11px; color:var(--muted); margin-top:1px; }

  .rail-section-label{
    font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); padding:0 6px; margin-bottom:6px;
  }
  .creche-list{ display:flex; flex-direction:column; gap:3px; }
  .creche-item{
    display:flex; align-items:center; gap:9px;
    padding:8px 8px; border-radius:9px; border:1px solid transparent;
    background:transparent; cursor:pointer; text-align:left; width:100%;
  }
  .creche-item:hover{ background: rgba(0,71,171,0.08); }
  .creche-item[aria-pressed="true"]{ background:var(--surface); border-color:var(--line); box-shadow:var(--shadow); }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .creche-item-text{ display:flex; flex-direction:column; min-width:0; }
  .creche-item-name{ font-weight:600; font-size:12.8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .creche-item-city{ font-size:11px; color:var(--muted); }

  .week-chip{
    font-size:11.5px; color:var(--ink-2); background:var(--surface);
    border:1px solid var(--line); border-radius:9px; padding:8px 10px; line-height:1.4;
  }
  .week-chip b{ color:var(--ink); display:block; font-size:12.5px; margin-bottom:1px; }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .navitem{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:9px;
    background:transparent; border:none; cursor:pointer; color:var(--ink-2); font-weight:600; font-size:13px; text-align:left;
  }
  .navitem:hover{ background:rgba(0,71,171,0.08); color:var(--ink); }
  .navitem[aria-current="true"]{ background:var(--accent); color:#fff; }
  .navitem[data-view="reel"][aria-current="true"]{ background:var(--case2); }
  .navitem .navdot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; }

  .rail-footer{ margin-top:auto; font-size:10.5px; color:var(--muted); padding:0 6px; }

  .rail-back{
    display:flex; align-items:center; gap:7px; padding:8px 10px; margin:0 4px;
    border-radius:9px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-2); font-weight:600; font-size:12px; cursor:pointer; text-align:left;
  }
  .rail-back:hover{ background:rgba(0,71,171,0.08); color:var(--ink); border-color:var(--line-strong); }
  .rail-back-arrow{ font-size:13px; line-height:1; }

  /* ---------- Main ---------- */
  main{ padding: 26px 34px 60px; max-width:1180px; }
  @media (max-width:640px){ main{ padding:18px; } }

  .topbar{ margin-bottom:22px; }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-strong); background:var(--accent-soft); display:inline-block; padding:3px 8px; border-radius:6px; margin-bottom:10px; }
  .eyebrow.eyebrow-case2{ color:var(--case2-strong); background:var(--case2-soft); }
  .topbar h1{ font-size:23px; font-weight:800; margin:0 0 6px; letter-spacing:-0.01em; }
  .topbar p{ margin:0; color:var(--ink-2); max-width:62ch; font-size:13.5px; }

  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0 26px; }
  @media (max-width:760px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
  .kpi-label{ font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  .kpi-value{ font-family:"Manrope",sans-serif; font-size:26px; font-weight:800; margin-top:4px; }
  .kpi-value.good{ color:var(--good); } .kpi-value.warning{ color:var(--warning); } .kpi-value.critical{ color:var(--critical); }
  .kpi-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .section-title{ font-size:14.5px; font-weight:800; font-family:"Manrope",sans-serif; margin: 26px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .section-title span.hint{ font-weight:500; font-size:11.5px; color:var(--muted); font-family:"Inter",sans-serif; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }

  /* overview table */
  .overview-table{ width:100%; border-collapse:collapse; }
  .overview-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; padding:12px 14px; border-bottom:1px solid var(--line); }
  .overview-table td{ padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .overview-table tr:last-child td{ border-bottom:none; }
  .overview-table tr.clickable{ cursor:pointer; }
  .overview-table tr.clickable:hover{ background: rgba(0,71,171,0.05); }
  .creche-cell{ display:flex; align-items:center; gap:9px; }
  .creche-cell-name{ font-weight:700; }
  .creche-cell-city{ font-size:11.5px; color:var(--muted); }
  .heatstrip{ display:flex; gap:4px; }
  .heat-dot{ width:16px; height:16px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:rgba(0,0,0,.55); }
  .table-scroll{ overflow-x:auto; }

  .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .pill .pdot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .pill.good{ background:var(--good-bg); color:var(--good); }
  .pill.warning{ background:var(--warning-bg); color:var(--warning); }
  .pill.serious{ background:var(--serious-bg); color:var(--serious); }
  .pill.critical{ background:var(--critical-bg); color:var(--critical); }

  /* day tabs */
  .daytabs{ display:flex; gap:6px; margin: 4px 0 16px; flex-wrap:wrap; }
  .daytab{ padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700; font-size:12.5px; color:var(--ink-2); display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-width:84px; }
  .daytab .d-date{ font-weight:500; font-size:10.5px; color:var(--muted); }
  .daytab[aria-selected="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }
  .daytab.case2[aria-selected="true"]{ border-color:var(--case2); background:var(--case2-soft); color:var(--case2-ink); }
  .daytab .d-badges{ display:flex; gap:4px; margin-top:3px; }
  .miniflag{ width:7px; height:7px; border-radius:50%; }

  /* block rows */
  .blocklist{ display:flex; flex-direction:column; gap:8px; }
  .blockrow{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  .blockrow summary{ list-style:none; cursor:pointer; padding:12px 14px; display:grid; grid-template-columns: 76px 1fr 92px 1.3fr 150px 16px; gap:14px; align-items:center; }
  .blockrow summary::-webkit-details-marker{ display:none; }
  @media (max-width:900px){ .blockrow summary{ grid-template-columns: 60px 1fr 78px; } .col-staff, .col-status{ display:none; } }
  .col-hour{ font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:12.5px; color:var(--ink-2); }
  .col-children{ display:flex; gap:6px; flex-wrap:wrap; }
  .badge{ font-size:11px; padding:3px 7px; border-radius:7px; background:var(--surface-2); border:1px solid var(--line); font-family:"IBM Plex Mono",monospace; color:var(--ink-2); }
  .badge b{ color:var(--ink); font-weight:600; }
  .col-npe{ font-family:"IBM Plex Mono",monospace; font-size:13px; text-align:center; }
  .col-npe .npe-label{ display:block; font-family:"Inter",sans-serif; font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .col-staff{ display:flex; gap:5px; flex-wrap:wrap; }
  .chip{ font-size:11px; padding:3px 8px; border-radius:99px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); }
  .chip.actif{ color:var(--ink); }
  .chip.conge{ background:var(--warning-bg); color:var(--warning); border-color:transparent; }
  .chip.arret_maladie{ background:var(--serious-bg); color:var(--serious); border-color:transparent; }
  .chip.demission{ background:var(--critical-bg); color:var(--critical); border-color:transparent; }
  .chip.non_identifie{ background:var(--surface); color:var(--muted); border-style:dashed; }
  .chev{ color:var(--muted); transition:transform .15s ease; justify-self:end; }
  details[open] .chev{ transform:rotate(90deg); }
  .blockrow-detail{ padding:0 14px 16px 104px; display:flex; flex-direction:column; gap:10px; }
  @media (max-width:900px){ .blockrow-detail{ padding:0 14px 16px 14px; } }
  .detail-line{ font-size:12.5px; color:var(--ink-2); }
  .detail-line b{ color:var(--ink); }
  .anomaly-note{ background:var(--warning-bg); color:#5c4200; border-radius:9px; padding:9px 11px; font-size:12.5px; }
  :root[data-theme="dark"] .anomaly-note, @media (prefers-color-scheme:dark){ .anomaly-note{ color:inherit; } }
  .staff-detail-grid{ display:flex; flex-direction:column; gap:5px; }
  .staff-detail-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .staff-detail-row .name{ font-weight:600; min-width:150px; }
  .margin-note{ font-size:12px; color:var(--muted); }

  /* mail cards */
  .mail-feed{ display:flex; flex-direction:column; gap:10px; }
  .mail-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  .mail-card summary{ list-style:none; cursor:pointer; padding:13px 15px; display:flex; align-items:flex-start; gap:12px; }
  .mail-card summary::-webkit-details-marker{ display:none; }
  .mail-icon{ width:32px; height:32px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-family:"Manrope"; font-weight:800; font-size:12px; }
  .mail-meta{ flex:1; min-width:0; }
  .mail-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:2px; }
  .mail-subject{ font-weight:700; font-size:13px; }
  .mail-sub{ font-size:11.5px; color:var(--muted); }
  .mail-date{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); white-space:nowrap; }
  .mail-body{ padding:0 15px 16px 59px; }
  @media (max-width:640px){ .mail-body{ padding:0 15px 16px 15px; } }
  .mail-body pre{ white-space:pre-wrap; font-family:"Inter",sans-serif; font-size:12.8px; color:var(--ink-2); background:var(--surface-2); border-radius:9px; padding:12px 13px; margin:0; line-height:1.55; }
  .tag{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:6px; }
  .tag.alerte{ background:var(--critical-bg); color:var(--critical); }
  .tag.relance{ background:var(--accent-soft); color:var(--accent-ink); }
  .tag.cas{ border:1px solid transparent; }
  .tag.cas-1{ background:var(--accent-soft); color:var(--accent-ink); }
  .tag.cas-2{ background:var(--case2-soft); color:var(--case2-ink); }

  /* reel rows */
  .reelrow{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  .reelrow summary{ list-style:none; cursor:pointer; padding:12px 14px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .reelrow summary::-webkit-details-marker{ display:none; }
  .reelrow .rr-hour{ font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:12.5px; color:var(--ink-2); width:64px; flex:none; }
  .reelrow .rr-npe{ font-family:"IBM Plex Mono",monospace; font-size:13px; width:120px; flex:none; }
  .reelrow .rr-npe .lbl{ display:block; font-family:"Inter",sans-serif; font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .reelrow .rr-eff{ font-family:"IBM Plex Mono",monospace; font-size:13px; width:150px; flex:none; }
  .reelrow .rr-eff .lbl{ display:block; font-family:"Inter",sans-serif; font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .rr-diff{ color:var(--serious); }
  .reelrow .rr-status{ margin-left:auto; }
  .reelrow .chev{ flex:none; }
  .incident-status{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:99px; }
  .incident-status.resolu{ background:var(--good-bg); color:var(--good); }
  .incident-status.escalade{ background:var(--critical-bg); color:var(--critical); }

  /* réel vs prévu comparison */
  .compare-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:560px){ .compare-grid{ grid-template-columns:1fr; } }
  .compare-col{ background:var(--surface-2); border-radius:10px; padding:11px 13px; }
  .compare-col .cc-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; }
  .compare-col .cc-npe{ font-family:"IBM Plex Mono",monospace; font-size:20px; font-weight:600; }
  .compare-col .cc-staff{ font-size:12px; color:var(--ink-2); margin-top:4px; }
  .compare-col.diff{ background:var(--serious-bg); }
  .ecart-note{ background:var(--serious-bg); color:var(--serious); border-radius:9px; padding:9px 11px; font-size:12.5px; font-weight:600; }

  /* incident timeline */
  .incident-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px; }
  .incident-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .incident-title{ font-family:"Manrope",sans-serif; font-weight:800; font-size:15px; }
  .incident-sub{ font-size:12px; color:var(--muted); margin-bottom:16px; }
  .timeline{ display:flex; flex-direction:column; gap:0; }
  .tl-item{ display:grid; grid-template-columns:78px 20px 1fr; gap:2px; }
  .tl-when{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); padding-top:2px; text-align:right; padding-right:8px; }
  .tl-rail{ display:flex; flex-direction:column; align-items:center; }
  .tl-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); margin-top:4px; flex:none; }
  .tl-item.responsable .tl-dot{ background:var(--warning); }
  .tl-line{ flex:1; width:1.5px; background:var(--line); margin-top:2px; }
  .tl-item:last-child .tl-line{ display:none; }
  .tl-body{ padding-bottom:16px; }
  .tl-author{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-strong); margin-bottom:2px; }
  .tl-item.responsable .tl-author{ color:var(--warning); }
  .tl-text{ font-size:13px; color:var(--ink-2); line-height:1.55; }
  .tl-text b{ color: var(--ink); }

  /* cover page */
  .cover{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px; gap:0; background:
      radial-gradient(560px 340px at 15% -8%, var(--accent-soft), transparent 60%),
      radial-gradient(620px 380px at 108% 8%, var(--accent-soft), transparent 55%);
  }
  .cover-logos{ display:flex; align-items:center; gap:22px; margin-bottom:38px; }
  .logo-slot{ display:flex; align-items:center; justify-content:center; height:92px; padding:8px 24px; background:#ffffff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  .logo-slot img{ max-height:82px; max-width:190px; object-fit:contain; display:block; }
  .logo-word{ font-family:"Manrope",sans-serif; font-weight:800; font-size:19px; letter-spacing:-0.01em; color:var(--ink-2); border:1.5px dashed var(--line-strong); border-radius:10px; padding:12px 20px; }
  .logo-x{ color:var(--muted); font-size:18px; font-weight:300; }
  .cover-eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-strong); background:var(--accent-soft); padding:5px 12px; border-radius:99px; margin-bottom:22px; }
  .cover h1{ font-size:44px; font-weight:800; letter-spacing:-0.02em; margin:0 0 12px; }
  .cover p.lead{ font-size:15.5px; color:var(--ink-2); max-width:52ch; margin:0 auto 34px; line-height:1.6; }
  .cover-cases{ display:flex; gap:14px; margin-bottom:38px; flex-wrap:wrap; justify-content:center; }
  .cover-case{ background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--accent); border-radius:14px; padding:16px 20px; box-shadow:var(--shadow); text-align:left; width:250px; }
  .cover-case.case2{ border-top-color:var(--case2); }

<script>
(function(){
  "use strict";

  /* =========================================================
     1. DONNÉES DE RÉFÉRENCE
  ========================================================= */
  var BLOCKS = [
    {i:0,  h:7,  label:"7h–8h"},  {i:1,  h:8,  label:"8h–9h"},
    {i:2,  h:9,  label:"9h–10h"}, {i:3,  h:10, label:"10h–11h"},
    {i:4,  h:11, label:"11h–12h"},{i:5,  h:12, label:"12h–13h"},
    {i:6,  h:13, label:"13h–14h"},{i:7,  h:14, label:"14h–15h"},
    {i:8,  h:15, label:"15h–16h"},{i:9,  h:16, label:"16h–17h"},
    {i:10, h:17, label:"17h–18h"},{i:11, h:18, label:"18h–19h"}
  ];

  var DAYS = [
    {id:"lun", label:"Lundi",    disp:"14/09"},
    {id:"mar", label:"Mardi",    disp:"15/09"},
    {id:"mer", label:"Mercredi", disp:"16/09"},
    {id:"jeu", label:"Jeudi",    disp:"17/09"},
    {id:"ven", label:"Vendredi", disp:"18/09"}
  ];

  // Profil d'inscriptions "type" (identique d'une crèche à l'autre pour la démo),
  // par bloc horaire — moins de 2 ans / 2 ans→scolarité / scolarisés (périscolaire).
  var CHILDREN_BASE = {
    m2:  [3,10,12,12,17,17,12,12,10,8,5,2],
    m27: [0,3,7,7,7,5,7,7,6,5,3,1],
    sco: [2,4,0,0,0,0,0,0,0,3,6,3]
  };

  function staffTemplate(creche, names){
    return [
      {id:"c",  creche:creche, nom:names[0], role:"7h–15h",  debut:7,  fin:15, jours:["lun","mar","mer","jeu","ven"], statuts:{}},
      {id:"s",  creche:creche, nom:names[1], role:"8h–16h",  debut:8,  fin:16, jours:["lun","mar","mer","jeu","ven"], statuts:{}},
      {id:"m",  creche:creche, nom:names[2], role:"8h–13h",  debut:8,  fin:13, jours:["lun","mar","mer","jeu","ven"], statuts:{}},
      {id:"p",  creche:creche, nom:names[3], role:"9h–17h",  debut:9,  fin:17, jours:["lun","mar","mer","jeu","ven"], statuts:{}},
      {id:"sy", creche:creche, nom:names[4], role:"11h–19h", debut:11, fin:19, jours:["lun","mar","mer","jeu","ven"], statuts:{}},
      {id:"e",  creche:creche, nom:names[5], role:"12h–19h", debut:12, fin:19, jours:["lun","mar","mer","jeu","ven"], statuts:{}}
    ];
  }

  var CRECHES = [
    {id:"kirchberg", nom:"Babilou Kirchberg",        ville:"Luxembourg – Kirchberg"},
    {id:"belair",    nom:"Babilou Belair",           ville:"Luxembourg – Belair"},
    {id:"gasperich", nom:"Babilou Gasperich",        ville:"Luxembourg – Gasperich"},
    {id:"esch",      nom:"Babilou Esch-sur-Alzette",  ville:"Esch-sur-Alzette"}
  ];

  var STAFF = {};

  // --- Kirchberg : crèche "démo" avec les 5 types d'anomalies ---
  STAFF.kirchberg = staffTemplate("kirchberg", ["Claire Muller","Sophie Nguyen","Marc Weber","Pascale Hoffmann","Sylviane Ferreira","Emmanuelle Lang"]);
  byId(STAFF.kirchberg,"m").statuts = {
    lun:{statut:"arret_maladie", detail:"Arrêt maladie du 08/09 au 14/09/2026 (certificat prolongé) — retour prévu le 15/09."}
  };
  byId(STAFF.kirchberg,"p").statuts = {
    lun:{statut:"conge", detail:"Congé posé et validé pour la journée du 14/09."}
  };
  STAFF.kirchberg.push({
    id:"j", creche:"kirchberg", nom:"Julien Barros", role:"8h–16h (renfort mardi)",
    debut:8, fin:16, jours:["mar"],
    statuts:{ mar:{statut:"demission", detail:"A démissionné — dernier jour travaillé le 11/09/2026. Reste inscrit sur le fichier planning transmis le même jour."} }
  });
  STAFF.kirchberg.push({
    id:"ni1", creche:"kirchberg", nom:"Poste soir en recrutement", role:"17h–19h",
    debut:17, fin:19, jours:["jeu","ven"],
    statuts:{ jeu:{statut:"non_identifie", detail:"Recrutement en cours pour le poste du soir ; arrivée espérée mi-septembre."},
              ven:{statut:"non_identifie", detail:"Recrutement en cours pour le poste du soir ; arrivée espérée mi-septembre."} }
  });
  STAFF.kirchberg.push({
    id:"ni2", creche:"kirchberg", nom:"Poste matin en recrutement", role:"7h–8h (renfort vendredi)",
    debut:7, fin:8, jours:["ven"],
    statuts:{ ven:{statut:"non_identifie", detail:"Renfort matinal recherché pour le vendredi ; recrutement en cours."} }
  });

  // --- Belair : une absence non répercutée sur le planning (congé, mercredi) ---
  STAFF.belair = staffTemplate("belair", ["Aline Petit","Noémie Faber","Karim Aziz","Denise Roth","Théo Santos","Marion Kessler"]);
  byId(STAFF.belair,"p").statuts = {
    mer:{statut:"conge", detail:"Congé posé et validé pour la journée du 16/09 — non retiré du planning transmis."}
  };

  // --- Gasperich : crèche de référence, aucune anomalie cette semaine ---
  STAFF.gasperich = staffTemplate("gasperich", ["Inès Da Silva","Yanis Colle","Léa Bertrand","Fabrice Wolter","Nadia Costa","Hugo Simon"]);

  // --- Esch-sur-Alzette : démission non retirée du planning (vendredi) ---
  STAFF.esch = staffTemplate("esch", ["Chloé Meyer","Antoine Ribeiro","Laurie Diallo","Karl Feller","Nora Peiffer","Damien Schuster"]);
  byId(STAFF.esch,"p").statuts = {
    ven:{statut:"demission", detail:"A démissionné — dernier jour travaillé le 11/09/2026. Reste inscrit(e) sur le planning du 18/09."}
  };

  function byId(list, id){ for (var k=0;k<list.length;k++){ if (list[k].id===id) return list[k]; } return null; }

  // Surcroît d'inscriptions le jeudi/vendredi 17h–18h à Kirchberg (bloc i=10),
  // qui justifie le besoin du poste "soir" en cours de recrutement.
  var CHILDREN_OVERRIDES = {
    kirchberg: {
      jeu: { 10:{m2:8, m27:4, sco:5} },
      ven: { 10:{m2:8, m27:4, sco:5} }
    }
  };

  var STATUT_LABEL = { actif:"En poste", conge:"Congé", arret_maladie:"Arrêt maladie", demission:"Démission", non_identifie:"Non identifié" };

  var STATUS_META = {
    conforme:            {label:"Conforme",               rank:0, tone:"good"},
    risque_marge_faible: {label:"Marge faible",           rank:1, tone:"warning"},
    risque_non_confirme: {label:"Couverture non confirmée",rank:2, tone:"serious"},
    non_conforme:        {label:"Non conforme",            rank:3, tone:"critical"}
  };

  /* =========================================================
     1bis. DONNÉES — CAS D'USAGE 2 (contrôle du réel, badgeage)
     Démonstration concentrée sur Babilou Kirchberg, mardi 15/09 —
     les deux scénarios retenus pour la démo du 17 septembre.
  ========================================================= */
  // Écarts de badgeage par rapport au planning prévu (bloc i -> ids exclus du "réel").
  var REAL_STAFF_OVERRIDES = {
    kirchberg: {
      mar: {
        1:  { exclude:["m"],  note:"Marc a badgé à 9h00 au lieu de 8h00 : badge oublié à domicile, entrée saisie manuellement par le responsable à son arrivée." },
        11: { exclude:["e"],  note:"Emmanuelle a badgé sa sortie à 18h00 (au lieu de 19h00 prévu) : au vu du planning, le NPE ressortait à 1 pour ce bloc." }
      }
    }
  };
  // Enfants présents au-delà de leur créneau réservé (retard de reprise).
  var REAL_CHILDREN_OVERRIDES = {
    kirchberg: {
      mar: { 11: { m27:+2 } } // Luc et Pauline, récupérés avec 1h de retard, encore présents 18h-19h
    }
  };

  var INCIDENTS = [
    {
      id:"marc-badge", creche:"kirchberg", jour:"mar", blocIdx:1, blocLabel:"8h–9h",
      titre:"Éducateur qui oublie de badger — Marc Weber",
      statut:"resolu",
      evenements:[
        {date:"15/09", heure:"08h–09h", auteur:"agent", texte:"Constat : sur le bloc 8h–9h, Marc était planifié mais n'a badgé qu'à 9h00. Effectif réel 2 au lieu de 3 prévus (NPE requis : 3)."},
        {date:"16/09", heure:"08h00", auteur:"agent", texte:"Mail au responsable de crèche pour signaler l'anomalie et demander un retour."},
        {date:"16/09", heure:"10h00", auteur:"responsable", texte:"« Marc était bien présent à 8h, mais il avait oublié son badge chez lui, donc j'ai procédé en manuel ; je l'ai fait à mon arrivée à 9h, mais j'ai oublié de renseigner aussi la première heure, je m'occupe de faire la régularisation. »"},
        {date:"17/09", heure:"08h00", auteur:"agent", texte:"Nouveau bouclage de la journée du 15/09 : l'écart n'apparaît plus. Confirmation envoyée au responsable, incident historisé dans le tableau de suivi des NPE (traçabilité en cas de contrôle externe)."}
      ]
    },
    {
      id:"pauline-retard", creche:"kirchberg", jour:"mar", blocIdx:11, blocLabel:"18h–19h",
      titre:"Famille en retard récurrent — Luc et Pauline",
      statut:"escalade",
      evenements:[
        {date:"15/09", heure:"17h–18h", auteur:"agent", texte:"Luc et Pauline récupérés avec 1h de retard. Sur le bloc 17h–18h, pas d'incidence (staffing suffisant) — information conservée pour le contrôle mensuel de facturation."},
        {date:"15/09", heure:"18h–19h", auteur:"agent", texte:"Sur le bloc 18h–19h : NPE réel recalculé à 2 (présence prolongée non réservée) alors qu'Emmanuelle a badgé sa sortie à 18h — effectif réel ramené à 1. Analyse historique : 6ᵉ retard de la famille de Pauline en moins de 10 jours sur ce même bloc (seuil d'alerte : 3 retards / 10 jours)."},
        {date:"15/09", heure:"19h30", auteur:"agent", texte:"Mail au responsable de crèche : écart NPE du bloc 18h–19h + alerte sur la récurrence des retards de la famille de Pauline."},
        {date:"15/09", heure:"20h15", auteur:"responsable", texte:"« Emmanuelle avait une urgence et a décidé, en accord avec Pascale qui était avec elle, de partir une heure avant car en voyant le planning, le NPE ressortait à 1. Emmanuelle et Pascale étaient en congé la semaine précédente et ne savaient pas que la famille de Pauline avait été en retard tous les jours et qu'il y avait donc un risque, j'avais oublié de les alerter. »"},
        {date:"15/09", heure:"20h30", auteur:"agent", texte:"« La non-conformité est enregistrée. Il faudra ajuster le planning pour tenir compte du risque de retard de la famille de Pauline, tout en leur rappelant la nécessité de respecter les horaires. » Non-conformité remontée le jour même à la direction pays et intégrée au tableau de bord de suivi des crèches."},
        {date:"16/09", heure:"—", auteur:"agent", texte:"Suivi programmé : contrôle du planning du mois suivant si les horaires de Pauline restent inchangés, contrôle de facturation en fin de mois (cas d'usage 3), et mail (hors contrôle interne) informant la famille d'une heure complémentaire facturée."}
      ]
    }
  ];

  /* =========================================================
     2. MOTEUR DE CALCUL
  ========================================================= */
  var state = { view:"overview", creche:"kirchberg", day:"lun", seuil:0 };

  function ceilSafe(x){ return Math.ceil(Math.round(x*10000)/10000); }

  function childrenFor(crecheId, dayId, blockIndex){
    var ov = CHILDREN_OVERRIDES[crecheId] && CHILDREN_OVERRIDES[crecheId][dayId] && CHILDREN_OVERRIDES[crecheId][dayId][blockIndex];
    if (ov) return ov;
    return { m2: CHILDREN_BASE.m2[blockIndex], m27: CHILDREN_BASE.m27[blockIndex], sco: CHILDREN_BASE.sco[blockIndex] };
  }

  function npeFor(children){
    return ceilSafe(children.m2/5 + children.m27/7 + children.sco/11);
  }

  function staffAt(crecheId, dayId, hour){
    var list = STAFF[crecheId] || [];
    var out = [];
    for (var k=0;k<list.length;k++){
      var s = list[k];
      if (s.jours.indexOf(dayId) === -1) continue;
      if (hour < s.debut || hour >= s.fin) continue;
      var override = s.statuts[dayId];
      var statut = override ? override.statut : "actif";
      out.push({ id:s.id, nom:s.nom, role:s.role, statut:statut, detail: override ? override.detail : null });
    }
    return out;
  }

  function blockCompute(crecheId, dayId, block){
    var children = childrenFor(crecheId, dayId, block.i);
    var npe = npeFor(children);
    var staff = staffAt(crecheId, dayId, block.h);
    var confirmed = staff.filter(function(s){ return s.statut === "actif"; });
    var nonId = staff.filter(function(s){ return s.statut === "non_identifie"; });
    var anomalies = staff.filter(function(s){ return s.statut === "conge" || s.statut === "arret_maladie" || s.statut === "demission"; });
    var confirmedCount = confirmed.length;
    var avecNonIdCount = confirmedCount + nonId.length;
    var margin = confirmedCount - npe;
    var status;
    if (confirmedCount >= npe){
      status = (margin <= state.seuil) ? "risque_marge_faible" : "conforme";
    } else {
      status = (avecNonIdCount >= npe) ? "risque_non_confirme" : "non_conforme";
    }
    return { children:children, npe:npe, staff:staff, confirmed:confirmed, nonId:nonId, anomalies:anomalies,
              confirmedCount:confirmedCount, avecNonIdCount:avecNonIdCount, margin:margin, status:status };
  }

  function weekCompute(crecheId){
    var out = {};
    DAYS.forEach(function(d){
      out[d.id] = BLOCKS.map(function(b){ return blockCompute(crecheId, d.id, b); });
    });
    return out;
  }

  function weekAggregate(crecheId){
    var week = weekCompute(crecheId);
    var counts = { conforme:0, risque_marge_faible:0, risque_non_confirme:0, non_conforme:0 };
    var worstByDay = {};
    var anomalySet = {};
    DAYS.forEach(function(d){
      var worst = 0;
      week[d.id].forEach(function(cell){
        counts[cell.status]++;
        worst = Math.max(worst, STATUS_META[cell.status].rank);
        cell.anomalies.forEach(function(a){ anomalySet[d.id+"|"+a.id] = true; });
      });
      worstByDay[d.id] = worst;
    });
    var worstOverall = 0;
    Object.keys(worstByDay).forEach(function(k){ worstOverall = Math.max(worstOverall, worstByDay[k]); });
    return { week:week, counts:counts, worstByDay:worstByDay, worstOverall:worstOverall, anomalyCount: Object.keys(anomalySet).length };
  }

  function rankToTone(rank){
    return rank===3 ? "critical" : rank===2 ? "serious" : rank===1 ? "warning" : "good";
  }

  // Cas d'usage 2 — recalcul du NPE et de l'effectif à partir du badgeage réel,
  // pour un jour/bloc donné (limité à Kirchberg / mardi 15/09 pour la démo).
  function reelCompute(crecheId, dayId, block){
    var ov = REAL_STAFF_OVERRIDES[crecheId] && REAL_STAFF_OVERRIDES[crecheId][dayId] && REAL_STAFF_OVERRIDES[crecheId][dayId][block.i];
    var childOv = REAL_CHILDREN_OVERRIDES[crecheId] && REAL_CHILDREN_OVERRIDES[crecheId][dayId] && REAL_CHILDREN_OVERRIDES[crecheId][dayId][block.i];

    var prevu = childrenFor(crecheId, dayId, block.i);
    var reel = { m2: prevu.m2 + (childOv&&childOv.m2||0), m27: prevu.m27 + (childOv&&childOv.m27||0), sco: prevu.sco + (childOv&&childOv.sco||0) };
    var npePrevu = npeFor(prevu);
    var npeReel = npeFor(reel);

    var staffPrevu = staffAt(crecheId, dayId, block.h).filter(function(s){ return s.statut === "actif"; });
    var excluded = ov ? ov.exclude : [];
    var staffReel = staffPrevu.filter(function(s){ return excluded.indexOf(s.id) === -1; });
    var ecart = staffPrevu.length !== staffReel.length || npePrevu !== npeReel;

    var marginReel = staffReel.length - npeReel;
    var statusReel = staffReel.length >= npeReel ? (marginReel <= state.seuil ? "risque_marge_faible" : "conforme") : "non_conforme";

    return {
      npePrevu:npePrevu, npeReel:npeReel, childrenPrevu:prevu, childrenReel:reel,
      staffPrevu:staffPrevu, staffReel:staffReel, marginReel:marginReel, statusReel:statusReel,
      ecart:ecart, note: ov ? ov.note : null
    };
  }

  /* =========================================================
     3. GÉNÉRATION DES ALERTES (mails simulés)
  ========================================================= */
  function affectedBlocksLabel(entry){
    var startB = null, endB = null;
    BLOCKS.forEach(function(b){ if (b.h >= entry.debut && b.h < entry.fin){ if (startB===null) startB=b; endB=b; } });
    if (!startB) return "";
    return startB.label.split("–")[0] + "–" + endB.label.split("–")[1];
  }

  function joursLabel(jours){
    var map = {}; DAYS.forEach(function(d){ map[d.id]=d.label; });
    return jours.map(function(j){ return map[j] + " " + (DAYS.filter(function(d){return d.id===j;})[0]||{}).disp; }).join(", ");
  }

  function buildAlerts(){
    var alerts = [];
    var crecheMap = {}; CRECHES.forEach(function(c){ crecheMap[c.id]=c; });

    CRECHES.forEach(function(c){
      (STAFF[c.id]||[]).forEach(function(s){
        var joursConcernes = Object.keys(s.statuts);
        if (!joursConcernes.length) return;
        var byType = {};
        joursConcernes.forEach(function(j){ var t = s.statuts[j].statut; (byType[t] = byType[t]||[]).push(j); });

        Object.keys(byType).forEach(function(type){
          var jours = byType[type];
          var detail = s.statuts[jours[0]].detail;
          var plage = affectedBlocksLabel(s);
          var nbBlocs = jours.length * BLOCKS.filter(function(b){ return b.h>=s.debut && b.h<s.fin; }).length;

          if (type === "non_identifie"){
            var premierJour = DAYS.filter(function(d){ return jours.indexOf(d.id)!==-1; })[0];
            var idxPremier = DAYS.indexOf(premierJour);
            var dateRelance = DAYS[Math.max(0, idxPremier-2)].disp;
            alerts.push({
              id: c.id+"-"+s.id+"-relance", creche:c.id, cas:1, type:"relance", dateEnvoi: dateRelance,

            });

  function render(){

    else renderParams();

  var backBtn = document.getElementById("rail-back-btn");
  if (backBtn) {
    backBtn.addEventListener("click", function(){
      document.getElementById("app-root").hidden = true;
      document.getElementById("cover-root").hidden = false;
    });
  }

  renderCover();
})();
</script>
